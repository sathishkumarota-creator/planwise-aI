<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - PocketSmart AI</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background-color: #f8fafc;">
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <div class="brand-icon"><i class="fa-solid fa-wallet"></i></div>
      PocketSmart
    </a>
    <ul class="nav-links">
      <li><a href="/"><i class="fa-solid fa-house"></i> Home</a></li>
      <li><a href="/login"><i class="fa-solid fa-user"></i> Sign In</a></li>
    </ul>
  </nav>

  <main class="main-content">
    <div class="auth-wrapper">
      <div class="auth-logo">PocketSmart</div>
      <div class="auth-subtitle">AI-Powered Budget Planning</div>

      <h2 class="auth-header">Create Your Account</h2>

      {% if error %}
        <div class="alert-error">
          <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
        </div>
      {% endif %}

      <form action="/register" method="POST">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="form-control-wrapper">
            <i class="fa-solid fa-user input-icon"></i>
            <input type="text" id="username" name="username" class="form-control" placeholder="Choose a username" required autofocus>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <div class="form-control-wrapper">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="form-control-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="password" name="password" class="form-control" placeholder="Create a strong password" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm Password</label>
          <div class="form-control-wrapper">
            <i class="fa-solid fa-shield-halved input-icon"></i>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Confirm your password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem; padding: 0.85rem;">
          Create Account <i class="fa-solid fa-user-plus"></i>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login">Sign In</a>
      </div>
    </div>
  </main>
</body>
</html>
