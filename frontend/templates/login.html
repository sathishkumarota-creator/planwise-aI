<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - PocketSmart AI</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background-color: #f8fafc;">
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <div class="brand-icon"><i class="fa-solid fa-wallet"></i></div>
      PocketSmart
    </a>
    <ul class="nav-links">
      <li><a href="/"><i class="fa-solid fa-house"></i> Home</a></li>
      <li><a href="/register" class="nav-btn"><i class="fa-solid fa-user-plus"></i> Sign Up</a></li>
    </ul>
  </nav>

  <main class="main-content">
    <div class="auth-wrapper">
      <div class="auth-logo">PocketSmart</div>
      <div class="auth-subtitle">AI-Powered Budget Planning</div>

      <h2 class="auth-header">Welcome Back</h2>

      {% if error %}
        <div class="alert-error">
          <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
        </div>
      {% endif %}

      <form action="/login" method="POST">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="form-control-wrapper">
            <i class="fa-solid fa-user input-icon"></i>
            <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" value="sai" required autofocus>
          </div>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
            <a href="#" style="font-size: 0.8rem; color: var(--text-muted); text-decoration: none;">Forgot Password?</a>
          </div>
          <div class="form-control-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" value="password123" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem; padding: 0.85rem;">
          Sign In <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register">Create Account</a>
      </div>
    </div>
  </main>
</body>
</html>
