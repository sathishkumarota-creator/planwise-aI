{% extends "base.html" %}
{% block title %}{{ kind_label }} planner{% endblock %}
{% block content %}
<header class="page-head">
  <div>
    <h1><i class="fa-solid fa-gem"></i> {{ kind_label }} planner</h1>
    <p class="page-head__sub">Occasion-first sets; add an outfit photo to color-match.</p>
  </div>
</header>

<form id="plannerForm" class="panel stack" data-kind="jewelry">
  <div class="grid-2">
    <label class="field">
      <span>Total budget (₹)</span>
      <input class="input" type="number" name="budget" min="500" max="100000000" step="100" value="10000" required>
    </label>
    <label class="field">
      <span>Occasion</span>
      <select class="input" name="occasion">
        <option value="wedding">Wedding</option>
        <option value="festival">Festival</option>
        <option value="birthday">Birthday</option>
        <option value="cocktail">Cocktail</option>
        <option value="everyday" selected>Everyday</option>
      </select>
    </label>
  </div>

  <label class="field">
    <span>Style preference <small>(optional)</small></span>
    <input class="input" name="style_preference" maxlength="400" placeholder="e.g. minimalist, temple jewelry, modern geometric">
  </label>

  <div class="field">
    <span>Outfit photo <small>(optional, JPEG/PNG/WebP up to 5 MB)</small></span>
    <div class="upload" id="photoDrop">
      <input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp" hidden>
      <button class="btn btn--ghost" type="button" id="photoPick"><i class="fa-solid fa-image"></i> Choose photo</button>
      <img id="photoPreview" class="upload__preview" hidden alt="Outfit preview">
      <span id="photoStatus" class="upload__status"></span>
    </div>
  </div>

  <div class="form-foot">
    <p class="form-foot__hint" data-error role="alert" hidden></p>
    <button class="btn btn--primary btn--lg" type="submit">Generate plan <i class="fa-solid fa-wand-magic-sparkles"></i></button>
  </div>
</form>

<section id="result" class="result" hidden></section>
{% endblock %}
