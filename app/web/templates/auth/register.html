{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="auth">
  <h1>Create your account</h1>
  <p class="auth__sub">Passwords need 8+ characters with upper, lower, and a digit.</p>
  {% if error %}<div class="alert alert--error"><i class="fa-solid fa-circle-exclamation"></i> {{ error }}</div>{% endif %}
  <form method="post" action="/register" class="stack">
    <label class="field">
      <span>Username</span>
      <input class="input" name="username" required minlength="3" maxlength="32"
             pattern="[A-Za-z0-9]+" value="{{ values.get('username', '') }}" autocomplete="username">
      <small class="field__hint">Letters and numbers only.</small>
    </label>
    <label class="field">
      <span>Email</span>
      <input class="input" type="email" name="email" required maxlength="254" value="{{ values.get('email', '') }}">
    </label>
    <label class="field">
      <span>Password</span>
      <input class="input" type="password" name="password" required minlength="8" autocomplete="new-password">
    </label>
    <label class="field">
      <span>Confirm password</span>
      <input class="input" type="password" name="confirm_password" required autocomplete="new-password">
    </label>
    <button class="btn btn--primary btn--block" type="submit">Create account</button>
  </form>
  <p class="auth__foot">Already registered? <a href="/login">Sign in</a></p>
</div>
{% endblock %}
